name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fti_auth_test
          POSTGRES_USER: fti
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fti -d fti_auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://fti:ci_password@localhost:5432/fti_auth_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and start the complete application
        run: docker compose --env-file .env.example up --detach --build --wait --wait-timeout 180
      - name: Check published services
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:3000/ > /dev/null
          curl --fail --silent http://localhost:3000/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser acceptance tests against Docker stack
        working-directory: frontend
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
        run: npm run test:e2e
      - name: Browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 3
      - name: Service logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color
      - name: Clean up
        if: always()
        run: docker compose --env-file .env.example down --volumes
